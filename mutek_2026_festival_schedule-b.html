    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            overflow: hidden; /* App takes full screen, internal scrolling */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Thicker strong divider for days */
        .day-divider {
            border-right-width: 4px !important;
            border-right-color: #475569 !important; /* slate-600 */
        }
    </style>
</head>
<body class="h-screen flex flex-col">

            <span class="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold text-slate-300 hidden md:inline-block">Schedule Diagram</span>
        </div>
        
        <!-- Controls: Day Filters, Search, Zoom -->
        <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
            
            <!-- Day Filters Container (injected via JS) -->
            <div id="day-filters" class="flex bg-slate-950 p-1 rounded-lg border border-slate-700/50 overflow-x-auto max-w-full">
                <!-- Buttons populate here -->
            </div>

            <!-- Search -->

                <input type="text" id="search-input" placeholder="Search artists..." class="bg-slate-800 text-white text-sm rounded-lg pl-9 pr-4 py-1.5 border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 w-full md:w-48 transition-all">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>

            <!-- Zoom -->
            <div class="flex items-center gap-1 bg-slate-950 rounded-lg p-1 border border-slate-700/50 shrink-0">
                <button id="zoom-out" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors" title="Zoom Out">

                </button>
                <span id="zoom-display" class="text-xs font-medium text-slate-300 w-10 text-center">100%</span>
                <button id="zoom-in" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors" title="Zoom In">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-auto relative bg-slate-950" id="schedule-container">
        <!-- Content injected here by JS -->
    </main>

    <!-- Event Details Modal -->

                            {"artist": "Poirier", "profile_url": "https://montreal.mutek.org/en/artists/poirier", "date": "30 Aug", "start_time": "23:35", "end_time": "00:25"},

                            {"artist": "Dave Huismans", "profile_url": "https://montreal.mutek.org/en/artists/dave-huismans", "date": "30 Aug", "start_time": "01:35", "end_time": "02:35"}

                            {"artist": "Matthew Herbert & Julian Sartorius", "profile_url": "https://montreal.mutek.org/en/artists/matthew-herbert-julian-sartorius", "date": "30 Aug", "start_time": "23:55", "end_time": "00:55"},
                            {"artist": "Dana Ruh", "profile_url": "https://montreal.mutek.org/en/artists/dana-ruh", "date": "30 Aug", "start_time": "01:00", "end_time": "02:00"},
                            {"artist": "MUTEK Soundsystem", "profile_url": "https://montreal.mutek.org/en/artists/mutek-soundsystem", "date": "30 Aug", "start_time": "02:30", "end_time": "05:30"}
                        ]
                    }
                }
            }
        ];

        // Global State & Layout Constants
        let currentSearch = '';
        let currentDayFilter = 'All';
        let zoomLevel = 1.0;

        const BASE_COL_WIDTH = 240; 
        const BASE_TIME_AXIS_WIDTH = 80;
        const BASE_PIXELS_PER_HOUR = 180;

        // Styling based on track categories
        const trackColors = {
            'EXPÉRIENCE': 'bg-blue-900/60 border border-blue-500/50 text-blue-100 shadow-[0_0_15px_rgba(59,130,246,0.15)]',
            'NOCTURNE': 'bg-purple-900/60 border border-purple-500/50 text-purple-100 shadow-[0_0_15px_rgba(168,85,247,0.15)]',
            'X/VISIONS': 'bg-emerald-900/60 border border-emerald-500/50 text-emerald-100 shadow-[0_0_15px_rgba(16,185,129,0.15)]',
            'MÉTROPOLIS': 'bg-rose-900/60 border border-rose-500/50 text-rose-100 shadow-[0_0_15px_rgba(244,63,94,0.15)]',
            'PLAY': 'bg-amber-900/60 border border-amber-500/50 text-amber-100 shadow-[0_0_15px_rgba(245,158,11,0.15)]',
            'DEFAULT': 'bg-slate-800 border border-slate-600 text-slate-200'
        };

        function getTrackColor(trackName) {
            for (let key in trackColors) {
                if (trackName.toUpperCase().includes(key)) return trackColors[key];
            }
            return trackColors['DEFAULT'];
        }

        // Alternating background colors for entire days
        const dayBgColors = [
            'bg-[#0f172a]/60', // slate-900, slightly darker
            'bg-[#020617]/40', // slate-950, deeper
        ];

        function processData() {
            const columnsMap = new Map();
            let minHour = 24, maxHour = 0;

            // 1. Flatten and parse events
            rawData.forEach(eventGroup => {
                const eventUrl = eventGroup.event_url;
                const schedule = eventGroup.structured_schedule;

                for (const venueName in schedule) {
                    const trackObj = schedule[venueName];
                    const trackName = trackObj.program_track;
                    const artists = trackObj.artists;

                    artists.forEach(artist => {
                        // Apply Search & Day Filters
                        if (currentDayFilter !== 'All' && artist.date !== currentDayFilter) return;
                        if (currentSearch && !artist.artist.toLowerCase().includes(currentSearch.toLowerCase())) return;

                        const dateStr = artist.date; // e.g. "25 Aug"
                        
                        // Map key represents a unique column
                        const colKey = `${dateStr}|${trackName}|${venueName}`;

                        if (!columnsMap.has(colKey)) {
                            columnsMap.set(colKey, {
                                date: dateStr,
                                track: trackName,
                                venue: venueName,
                                eventUrl: eventUrl,
                                events: []
                            });
                        }

                        // Time Parsing
                        let sTime = artist.start_time;
                        let eTime = artist.end_time;
                        let sHour = 0, sMin = 0, eHour = 0, eMin = 0;
                        let isUnknown = sTime.toLowerCase() === 'unknown';

                        if (!isUnknown) {
                            [sHour, sMin] = sTime.split(':').map(Number);
                            [eHour, eMin] = eTime.split(':').map(Number);

                            // Midnight logic (assume festival runs evening into next morning)
                            if (sHour < 12) sHour += 24; 
                            if (eHour < 12) eHour += 24;

                            minHour = Math.min(minHour, sHour);
                            maxHour = Math.max(maxHour, Math.ceil(eHour + (eMin > 0 ? 0.5 : 0)));
                        }

                        columnsMap.get(colKey).events.push({
                            artist: artist.artist,
                            profileUrl: artist.profile_url,
                            date: dateStr,
                            track: trackName,
                            venue: venueName,
                            startTime: sTime,
                            endTime: eTime,
                            sHour, sMin, eHour, eMin, isUnknown
                        });
                    });
                }
            });

            // Adjust min/max bounds safely
            if (minHour > maxHour) { minHour = 14; maxHour = 30; } 
            else {
                minHour = Math.max(0, minHour - 1); 
                maxHour = maxHour + 1;
            }

            // 2. Sort columns by Date -> Track -> Venue
            const sortedColumns = Array.from(columnsMap.values()).sort((a, b) => {
                const timeA = parseDateHelper(a.date);
                const timeB = parseDateHelper(b.date);
                if (timeA !== timeB) return timeA - timeB;
                if (a.track !== b.track) return a.track.localeCompare(b.track);
                return a.venue.localeCompare(b.venue);
            });

            // 3. Create Hierarchical Header Groups (Date -> Track -> Venue)
            const dateGroups = [];
            let currentDayIndex = 0;

            sortedColumns.forEach(col => {
                let lastDate = dateGroups[dateGroups.length - 1];
                
                // New Date
                if (!lastDate || lastDate.date !== col.date) {
                    const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(new Date(parseDateHelper(col.date)));
                    dateGroups.push({
                        date: col.date,
                        dayName: dayName,
                        span: 1,
                        bgColor: dayBgColors[currentDayIndex % dayBgColors.length],
                        tracks: [{
                            track: col.track,
                            eventUrl: col.eventUrl,
                            span: 1,
                            venues: [col.venue]
                        }]
                    });
                    currentDayIndex++;
                } else {
                    lastDate.span++;
                    let lastTrack = lastDate.tracks[lastDate.tracks.length - 1];
                    
                    // New Track under existing date
                    if (!lastTrack || lastTrack.track !== col.track) {
                        lastDate.tracks.push({
                            track: col.track,
                            eventUrl: col.eventUrl,
                            span: 1,
                            venues: [col.venue]
                        });
                    } else {
                        // Append venue to existing track
                        lastTrack.span++;
                        lastTrack.venues.push(col.venue);
                    }
                }
            });

            return { minHour, maxHour, sortedColumns, dateGroups };
        }

        function renderSchedule() {
            const { minHour, maxHour, sortedColumns, dateGroups } = processData();
            const container = document.getElementById('schedule-container');
            
            if (sortedColumns.length === 0) {
                container.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 flex-col gap-3">
                    <svg class="w-12 h-12 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-lg font-medium">No events found matching your criteria.</p>
                </div>`;
                return;
            }

            // Apply Zoom Levels dynamically
            const colWidth = BASE_COL_WIDTH * zoomLevel;
            const timeAxisWidth = BASE_TIME_AXIS_WIDTH; 
            const pixelsPerHour = BASE_PIXELS_PER_HOUR * zoomLevel;

            let html = `<div class="inline-block min-w-full">`;

            // ==== HEADERS ====
            html += `<div class="sticky top-0 z-40 flex flex-col shadow-[0_10px_30px_-10px_rgba(0,0,0,0.5)]">`;

            // Layer 1: Date Row
            html += `<div class="flex border-b border-slate-700/80 bg-slate-900">
                <div class="sticky left-0 w-[${timeAxisWidth}px] min-w-[${timeAxisWidth}px] bg-slate-900 border-r border-slate-700/80 z-50"></div>`;
            
            dateGroups.forEach((dg, i) => {
                const isLastDay = i === dateGroups.length - 1;
                const borderClass = isLastDay ? 'border-r border-slate-700/80' : 'day-divider';
                const w = dg.span * colWidth;
                html += `
                    <div class="py-3 text-center text-sm font-bold text-blue-400 uppercase tracking-widest ${borderClass} ${dg.bgColor}" style="width: ${w}px; min-width: ${w}px;">
                        ${dg.dayName}, ${dg.date}
                    </div>
                `;
            });
            html += `</div>`;

            // Layer 2: Track Row
            html += `<div class="flex border-b border-slate-700/80 bg-slate-900/95">
                <div class="sticky left-0 w-[${timeAxisWidth}px] min-w-[${timeAxisWidth}px] bg-slate-900 border-r border-slate-700/80 z-50"></div>`;
            
            dateGroups.forEach((dg, dIndex) => {
                const isLastDay = dIndex === dateGroups.length - 1;
                dg.tracks.forEach((tr, tIndex) => {
                    const isLastTrackOfDay = tIndex === dg.tracks.length - 1;
                    const applyStrongBorder = isLastTrackOfDay && !isLastDay;
                    const borderClass = applyStrongBorder ? 'day-divider' : 'border-r border-slate-700/60';
                    const w = tr.span * colWidth;
                    
                    html += `
                        <div class="py-2 px-2 flex justify-center items-center ${borderClass} ${dg.bgColor}" style="width: ${w}px; min-width: ${w}px;">
                            <a href="${tr.eventUrl}" target="_blank" class="text-xs font-semibold text-slate-300 hover:text-white hover:underline flex items-center gap-1 transition-colors bg-slate-800/50 px-3 py-1 rounded-full">
                                ${tr.track}
                                <svg class="w-3 h-3 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        </div>
                    `;
                });
            });
            html += `</div>`;

            // Layer 3: Venue Row
            html += `<div class="flex border-b border-slate-700/80 bg-slate-900">
                <div class="sticky left-0 w-[${timeAxisWidth}px] min-w-[${timeAxisWidth}px] bg-slate-900 border-r border-slate-700/80 z-50 flex items-end justify-center pb-2 text-[10px] text-slate-500 font-bold uppercase tracking-wider">Time</div>`;
            
            dateGroups.forEach((dg, dIndex) => {
                const isLastDay = dIndex === dateGroups.length - 1;
                dg.tracks.forEach((tr, tIndex) => {
                    const isLastTrackOfDay = tIndex === dg.tracks.length - 1;
                    tr.venues.forEach((venue, vIndex) => {
                        const isLastVenueOfTrack = vIndex === tr.venues.length - 1;
                        const applyStrongBorder = isLastTrackOfDay && isLastVenueOfTrack && !isLastDay;
                        const borderClass = applyStrongBorder ? 'day-divider' : 'border-r border-slate-700/50';
                        
                        html += `
                            <div class="py-2.5 px-3 text-center text-xs font-medium text-slate-400 truncate flex items-center justify-center gap-1.5 ${borderClass} ${dg.bgColor}" style="width: ${colWidth}px; min-width: ${colWidth}px;" title="${venue}">
                                <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                <span class="truncate">${venue}</span>
                            </div>
                        `;
                    });
                });
            });
            html += `</div></div>`; // End Headers

            // ==== GRID BODY ====
            const totalHeight = (maxHour - minHour) * pixelsPerHour;
            html += `<div class="flex relative" style="height: ${totalHeight}px;">`;

            // Y-Axis
            html += `<div class="sticky left-0 w-[${timeAxisWidth}px] min-w-[${timeAxisWidth}px] bg-slate-900 border-r border-slate-700/80 z-30 h-full">`;
            for (let h = minHour; h < maxHour; h++) {
                const displayHour = h > 24 ? h - 24 : h;
                const ampm = h >= 24 ? 'AM' : (h >= 12 && h < 24 ? 'PM' : 'AM');
                const formattedHour = displayHour > 12 ? displayHour - 12 : (displayHour === 0 ? 12 : displayHour);
                const yPos = (h - minHour) * pixelsPerHour;
                
                html += `
                    <div class="absolute w-full text-right pr-3 text-xs text-slate-500 font-semibold" style="top: ${yPos}px; transform: translateY(-50%);">
                        ${formattedHour}:00 <span class="text-[9px] opacity-70">${ampm}</span>
                    </div>
                `;
            }
            html += `</div>`;

            // Horizontal Grid Lines overlay
            html += `<div class="absolute top-0 bottom-0 pointer-events-none z-10" style="left: ${timeAxisWidth}px; right: 0;">`;
            for (let h = minHour; h < maxHour; h++) {
                const yPos = (h - minHour) * pixelsPerHour;
                html += `<div class="absolute w-full border-t border-slate-700/40" style="top: ${yPos}px;"></div>`;
                html += `<div class="absolute w-full border-t border-slate-800/40 border-dashed" style="top: ${yPos + (pixelsPerHour/2)}px;"></div>`;
            }
            html += `</div>`;

            // Columns and Events
            let globalColIndex = 0;
            dateGroups.forEach((dg, dIndex) => {
                const isLastDay = dIndex === dateGroups.length - 1;
                dg.tracks.forEach((tr, tIndex) => {
                    const isLastTrackOfDay = tIndex === dg.tracks.length - 1;
                    tr.venues.forEach((venue, vIndex) => {
                        const isLastVenueOfTrack = vIndex === tr.venues.length - 1;
                        const applyStrongBorder = isLastTrackOfDay && isLastVenueOfTrack && !isLastDay;
                        const borderClass = applyStrongBorder ? 'day-divider' : 'border-r border-slate-800/60';
                        const colData = sortedColumns[globalColIndex];
                        
                        html += `<div class="relative h-full ${borderClass} ${dg.bgColor}" style="width: ${colWidth}px; min-width: ${colWidth}px;">`;

                        // Render Unknown Times Stacked at the top
                        let unknownOffset = 10;
                        colData.events.forEach(ev => {
                            if (ev.isUnknown) {
                                const height = 45;
                                const safeJson = JSON.stringify(ev).replace(/'/g, "&apos;").replace(/"/g, '&quot;');
                                const style = getTrackColor(ev.track);
                                
                                html += `
                                    <div class="absolute w-full p-1.5 z-20 transition-all hover:scale-105 hover:z-30 cursor-pointer" 
                                         style="top: ${unknownOffset}px; height: ${height}px;"
                                         onclick="openModal('${safeJson}')">
                                        <div class="h-full w-full rounded-md px-3 py-1 flex flex-col justify-center overflow-hidden border border-dashed ${style}">
                                            <span class="font-bold text-sm truncate leading-tight">${ev.artist}</span>
                                            <span class="text-[10px] opacity-80 mt-0.5">Time TBA</span>
                                        </div>
                                    </div>
                                `;
                                unknownOffset += (height + 5);
                            }
                        });

                        // Render Known Times
                        colData.events.forEach(ev => {
                            if (!ev.isUnknown) {
                                const top = (ev.sHour - minHour + (ev.sMin / 60)) * pixelsPerHour;
                                const height = ((ev.eHour - ev.sHour) + (ev.eMin - ev.sMin) / 60) * pixelsPerHour;
                                const safeJson = JSON.stringify(ev).replace(/'/g, "&apos;").replace(/"/g, '&quot;');
                                const style = getTrackColor(ev.track);
                                
                                html += `
                                    <div class="absolute w-full p-1.5 z-20 transition-all hover:scale-[1.03] hover:z-30 cursor-pointer" 
                                         style="top: ${top}px; height: ${height}px;"
                                         onclick="openModal('${safeJson}')">
                                        <div class="h-full w-full rounded-md p-3 flex flex-col overflow-hidden relative group ${style}">
                                            <!-- Decorative Left Bar -->
                                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-white/20"></div>
                                            
                                            <span class="font-bold text-base truncate leading-snug ml-1 group-hover:text-white transition-colors">${ev.artist}</span>
                                            <span class="text-xs opacity-80 mt-1 ml-1 font-medium tracking-wide">${ev.startTime} – ${ev.endTime}</span>
                                        </div>
                                    </div>
                                `;
                            }
                        });

                        html += `</div>`;
                        globalColIndex++;
                    });
                });
            });

            html += `</div></div>`; // End Grid Body & Inner wrapper
            container.innerHTML = html;
        }

        function openModal(eventJsonStr) {
            const ev = JSON.parse(eventJsonStr);
            
            document.getElementById('modal-artist').textContent = ev.artist;
            document.getElementById('modal-track').textContent = ev.track;
            document.getElementById('modal-date').textContent = ev.date + ', 2026';
            document.getElementById('modal-time').textContent = ev.isUnknown ? 'Time to be announced' : `${ev.startTime} - ${ev.endTime}`;
            document.getElementById('modal-venue').textContent = ev.venue;
            
            const profileBtn = document.getElementById('modal-profile-link');
            if (ev.profileUrl && ev.profileUrl !== "#") {
                profileBtn.href = ev.profileUrl;
                profileBtn.style.display = 'flex';
            } else {
                profileBtn.style.display = 'none';
            }

            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.remove('hidden');
            // Trigger reflow
            void modal.offsetWidth;
            
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // match transition duration
        }

        // Close modal on outside click
        document.getElementById('event-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // --- New Features: Filters & Zoom ---
        
        // Helper function extracted globally to share sorting logic
        const parseDateHelper = (dStr) => {
            const [day, mon] = dStr.split(' ');
            const months = {Aug: 7, Sep: 8};
            return new Date(2026, months[mon] || 7, parseInt(day)).getTime();
        };

        function initControls() {
            // Setup Day Filters dynamically from data
            const daysSet = new Set();
            rawData.forEach(eg => {
                for (const v in eg.structured_schedule) {
                    eg.structured_schedule[v].artists.forEach(a => daysSet.add(a.date));
                }
            });
            const days = Array.from(daysSet).sort((a, b) => parseDateHelper(a) - parseDateHelper(b));
            
            const filterContainer = document.getElementById('day-filters');
            
            // Generate "All" Button
            const allBtn = document.createElement('button');
            allBtn.className = `px-4 py-1.5 text-xs font-semibold rounded-md transition-colors ${currentDayFilter === 'All' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`;
            allBtn.textContent = 'All Days';
            allBtn.onclick = () => { currentDayFilter = 'All'; updateFilters(); };
            filterContainer.appendChild(allBtn);

            // Generate Individual Day Buttons
            days.forEach(day => {
                const dayBtn = document.createElement('button');
                dayBtn.className = `px-4 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap ${currentDayFilter === day ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`;
                dayBtn.textContent = day;
                dayBtn.onclick = () => { currentDayFilter = day; updateFilters(); };
                filterContainer.appendChild(dayBtn);
            });

            // Hook up Search Input
            document.getElementById('search-input').addEventListener('input', (e) => {
                currentSearch = e.target.value;
                renderSchedule();
            });

            // Hook up Zoom Controls
            document.getElementById('zoom-in').addEventListener('click', () => {
                zoomLevel = Math.min(2.0, zoomLevel + 0.1);
                updateZoomDisplay();
                renderSchedule();
            });
            
            document.getElementById('zoom-out').addEventListener('click', () => {
                zoomLevel = Math.max(0.5, zoomLevel - 0.1);
                updateZoomDisplay();
                renderSchedule();
            });
        }

        function updateFilters() {
            // Re-render button visual states after clicking
            const filterContainer = document.getElementById('day-filters');
            Array.from(filterContainer.children).forEach(btn => {
                const isMatch = btn.textContent === currentDayFilter || (btn.textContent === 'All Days' && currentDayFilter === 'All');
                btn.className = `px-4 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap ${isMatch ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`;
            });
            renderSchedule();
        }

        function updateZoomDisplay() {
            document.getElementById('zoom-display').textContent = Math.round(zoomLevel * 100) + '%';
        }

        // Initialize application controls and render
        document.addEventListener('DOMContentLoaded', () => {
            initControls();
            renderSchedule();
        });
    </script>
</body>
</html>
