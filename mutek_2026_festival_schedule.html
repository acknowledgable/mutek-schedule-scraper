    <title>MUTEK 2026 Festival Schedule</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mutek: {
                            black: '#0D0D11',
                            dark: '#14141A',
                            card: '#1A1A24',
                            accent: '#3B82F6',
                            purple: '#A855F7',
                            pink: '#EC4899',
                            cyan: '#06B6D4',
                            emerald: '#10B981',
                            amber: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for smooth visual experience */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #14141A;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A38;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3B82F6;
        }

        /* iOS WebKit Hardware-Accelerated Smooth Sticky Scrolling */
        #gridViewport {
            -webkit-overflow-scrolling: touch;
            overflow: auto;
        }

        .sticky-corner-cell {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            z-index: 55;
        }

        .sticky-header-row {
            position: -webkit-sticky;
            position: sticky;
            z-index: 30;
        }

        .sticky-time-col {
            position: -webkit-sticky;
            position: sticky;
            left: 0;
            z-index: 40;
        }

        .performance-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .performance-card:hover {
            transform: translateY(-2px) scale(1.02);
            z-index: 25 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .is-favorite {
            border-width: 3px !important;
            border-color: #F59E0B !important;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.45) !important;
        }

        /* Subtle grid background pattern */
        .time-grid-bg {
            background-size: 100% 60px;
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-[#0D0D11] text-gray-100 font-sans antialiased min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <!-- Header / Navbar -->
    <header class="bg-[#14141A]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
                    MUTEK 2026
                </h1>
                <p class="text-xs text-gray-400 flex items-center gap-1">
                    <span>Interactive Schedule by Scott Posey</span>
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="text-emerald-400 text-[10px] font-mono">87 ARTISTS</span>
                </p>
            </div>
        </div>

        <!-- Filter & Search Bar Controls -->
        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <!-- Search Bar -->
            <div class="relative flex-1 md:w-64">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Search artist, track..." 
                    class="w-full bg-[#1A1A24] text-sm text-gray-200 pl-9 pr-8 py-1.5 rounded-lg border border-gray-700/60 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder-gray-500">
                <button id="clearSearch" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Favorites Toggle Filter -->
            <button id="favoritesFilterBtn" onclick="toggleFavoritesOnlyFilter()" 
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium border border-gray-700/60 bg-[#1A1A24] text-gray-300 hover:text-amber-400 transition-colors">
                <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400"></i>
                <span id="favoritesBtnText">Favorites (<span id="favCount">0</span>)</span>
            </button>

            <!-- Date Filter Pills -->
            <div id="dateFilters" class="flex items-center gap-1 bg-[#1A1A24] p-1 rounded-lg border border-gray-800 text-xs overflow-x-auto max-w-full">
                <!-- Dynamically Inserted -->
            </div>

            <!-- Zoom Controls -->
            <div class="hidden sm:flex items-center gap-1 bg-[#1A1A24] p-1 rounded-lg border border-gray-800 text-xs">
                <button id="zoomOutBtn" class="p-1 hover:bg-gray-700/50 rounded text-gray-300" title="Decrease Hour Scale">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <span id="zoomLevelText" class="px-1 text-[11px] font-mono text-gray-400">100%</span>
                <button id="zoomInBtn" class="p-1 hover:bg-gray-700/50 rounded text-gray-300" title="Increase Hour Scale">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Track/Series Legend & Quick Stats -->
    <section class="bg-[#14141A] border-b border-gray-800/80 px-4 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2 overflow-x-auto py-0.5" id="trackLegend">
            <!-- Multi-Select Track Toggle Buttons dynamically inserted -->
        </div>
    </section>

    <!-- Main Interactive Grid Container -->
    <main class="flex-1 relative overflow-auto bg-[#0D0D11] min-h-[500px]" id="gridViewport">
        <div id="scheduleGrid" class="relative inline-block min-w-full select-none">
            <!-- Dynamic Grid Rendered Here -->
        </div>
    </main>

    <!-- Modal for Artist Details -->
    <div id="artistModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#1A1A24] border border-gray-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0 duration-200" id="artistModalContent">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span id="modalTrackBadge" class="inline-block px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 mb-2">
                        TRACK
                    </span>
                    <h3 id="modalArtistName" class="text-2xl font-bold text-white tracking-tight">Artist Name</h3>
                </div>
                <div class="flex items-center gap-1">
                    <button id="modalFavBtn" class="p-1.5 rounded-lg text-gray-400 hover:text-amber-400 hover:bg-gray-800 transition-colors" title="Toggle Favorite">
                        <i data-lucide="star" class="w-5 h-5"></i>
                    </button>
                    <button id="closeModal" class="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="space-y-3 border-t border-b border-gray-800 py-4 my-4 text-sm">
                <div class="flex items-center text-gray-300">
                    <i data-lucide="calendar-days" class="w-4 h-4 mr-3 text-blue-400"></i>
                    <span class="text-gray-400 w-16">Date:</span>
                    <span id="modalDate" class="font-medium text-white">25 Aug 2026</span>
                </div>
                <div class="flex items-center text-gray-300">
                    <i data-lucide="clock" class="w-4 h-4 mr-3 text-emerald-400"></i>
                    <span class="text-gray-400 w-16">Time:</span>
                    <span id="modalTime" class="font-medium text-white">18:30 - 19:05</span>
                </div>
                <div class="flex items-center text-gray-300">
                    <i data-lucide="map-pin" class="w-4 h-4 mr-3 text-purple-400"></i>
                    <span class="text-gray-400 w-16">Venue:</span>
                    <span id="modalVenue" class="font-medium text-white">Main Venue</span>
                </div>
            </div>

            <div class="flex items-center justify-between pt-2">
                <a id="modalEventLink" href="#" target="_blank" rel="noopener noreferrer" 
                   class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-600/20">
                    <span>View Event Page</span>
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
                <button id="closeModalBtn" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-medium transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

            <span>MUTEK Montréal 27th Edition Data</span>
        </div>
        <div>

        const COOKIE_NAME = 'mutek_favorites_2026';

        function setCookie(name, value, days = 365) {
            const date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)};${expires};path=/;SameSite=Lax`;
        }

        function getCookie(name) {
            const cname = name + "=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(cname) === 0) {
                    return c.substring(cname.length, c.length);
                }
            }
            return "";
        }

        function loadFavorites() {
            try {
                const cookieVal = getCookie(COOKIE_NAME);
                if (cookieVal) {
                    return new Set(JSON.parse(cookieVal));
                }
            } catch (e) {
                console.error("Error reading favorite cookie:", e);
            }
            return new Set();
        }

        function saveFavorites(favoritesSet) {
            const arr = Array.from(favoritesSet);
            setCookie(COOKIE_NAME, JSON.stringify(arr));
            updateFavoritesCountBadge();
        }

        function getPerformanceId(perf) {
            return `${perf.artist}_${perf.date}_${perf.start_time}`.replace(/[^a-zA-Z0-9_-]/g, '_');
        }

        let favoritesSet = loadFavorites();

            if (event) {

            if (favoritesSet.has(perfId)) {

            saveFavorites(favoritesSet);
            renderSchedule();
            if (currentModalPerf && getPerformanceId(currentModalPerf) === perfId) {
                updateModalFavBtn(favoritesSet.has(perfId));

        function toggleFavoritesOnlyFilter() {
            showFavoritesOnly = !showFavoritesOnly;
            const btn = document.getElementById('favoritesFilterBtn');
            if (showFavoritesOnly) {
                btn.classList.remove('bg-[#1A1A24]', 'text-gray-300');

                btn.classList.add('bg-[#1A1A24]', 'text-gray-300');

            renderSchedule();
        }

        function processData() {
            const dateMap = new Map();
            const dateOrder = ["25 Aug", "26 Aug", "27 Aug", "28 Aug", "29 Aug", "30 Aug"];

            dateOrder.forEach(date => {
                dateMap.set(date, new Map());
            });

            rawFestivalData.forEach(event => {
                const url = event.event_url;
                const schedule = event.structured_schedule;

                const trackInfoKeys = Object.keys(schedule);
                const venueOrderingRank = {
                    'Esplanade Tranquille': 1,
                    'Studio-Théâtre des Grands Ballets': 2,
                    'Maison symphonique': 3,
                    'Espace SAT': 4,
                    'Satosphère': 5,
                    'MTELUS': 6
                };

                trackInfoKeys.sort((a, b) => {
                    const cleanA = (a.trim() === 'Satoshpère') ? 'Satosphère' : a.trim();
                    const cleanB = (b.trim() === 'Satoshpère') ? 'Satosphère' : b.trim();
                    const rA = venueOrderingRank[cleanA] ?? 99;
                    const rB = venueOrderingRank[cleanB] ?? 99;
                    return rA - rB;
                });

                trackInfoKeys.forEach(venueName => {
                    let cleanVenue = venueName.trim();
                    if (cleanVenue === 'Satoshpère') cleanVenue = 'Satosphère';

                    const trackInfo = schedule[venueName];
                    const programTrack = trackInfo.program_track || "Unknown";
                    const venueKey = cleanVenue + '|' + programTrack;

                    if (trackInfo.artists && Array.isArray(trackInfo.artists)) {
                        trackInfo.artists.forEach(item => {
                            const date = item.date;
                            if (!dateMap.has(date)) {
                                dateMap.set(date, new Map());
                            }

                            const venuesInDate = dateMap.get(date);
                            if (!venuesInDate.has(venueKey)) {
                                venuesInDate.set(venueKey, {
                                    venue: cleanVenue,
                                    trackName: programTrack,
                                    eventUrl: url,
                                    performances: []
                                });
                            }

                            const perfObj = {
                                ...item,
                                track: programTrack,
                                venue: cleanVenue,
                                event_url: url
                            };
                            perfObj.id = getPerformanceId(perfObj);

                            venuesInDate.get(venueKey).performances.push(perfObj);
                        });
                    }
                });
            });

            return { dateMap, dateOrder };
        }

        function getTrackCategory(trackName) {
            if (!trackName) return 'DEFAULT';
            const upper = trackName.toUpperCase();
            if (upper.includes('PLAY')) return 'PLAY';
            if (upper.includes('EXPÉRIENCE')) return 'EXPÉRIENCE';
            if (upper.includes('X/VISIONS')) return 'X/VISIONS';
            if (upper.includes('NOCTURNE')) return 'NOCTURNE';
            if (upper.includes('MÉTROPOLIS')) return 'MÉTROPOLIS';
            return 'DEFAULT';
        }

        function parseTimeToHours(timeStr, baseDate) {
            if (!timeStr || timeStr === 'Unknown') return null;
            const [h, m] = timeStr.split(':').map(Number);
            let hourVal = h + m / 60;
            if (hourVal < 12) {
                hourVal += 24;
            }
            return hourVal;
        }

        function renderSchedule() {
            const { dateMap, dateOrder } = processData();
            const gridContainer = document.getElementById('scheduleGrid');

            const minHour = 14; 
            const maxHour = 30;
            const totalHours = maxHour - minHour;

            const displayedDates = activeDateFilter === 'ALL' 
                ? dateOrder 
                : dateOrder.filter(d => d === activeDateFilter);

            let columns = [];
            let dateGroups = [];

            displayedDates.forEach(date => {
                const venuesMap = dateMap.get(date);
                if (venuesMap && venuesMap.size > 0) {
                    let tracksMap = new Map();
                    for (const [vKey, vData] of venuesMap.entries()) {
                        const catKey = getTrackCategory(vData.trackName);
                        if (!activeTracksSet.has(catKey)) {
                            continue;
                        }

                        // When Favorites Only is active, exclude venue columns that have no favorites
                        if (showFavoritesOnly) {
                            const hasFavorites = vData.performances.some(p => favoritesSet.has(p.id));
                            if (!hasFavorites) {
                                continue;
                            }
                        }

                        if (!tracksMap.has(vData.trackName)) {
                            tracksMap.set(vData.trackName, {
                                trackName: vData.trackName,
                                eventUrl: vData.eventUrl,
                                venues: []
                            });
                        }
                        tracksMap.get(vData.trackName).venues.push(vData);
                    }

                    if (tracksMap.size === 0) {
                        return;
                    }

                    let dateColCount = 0;
                    let trackGroups = [];

                    Array.from(tracksMap.values()).sort((a, b) => {
                        const catA = getTrackCategory(a.trackName);
                        const catB = getTrackCategory(b.trackName);
                        const rankA = trackOrderRank[catA] ?? 99;
                        const rankB = trackOrderRank[catB] ?? 99;
                        if (rankA !== rankB) return rankA - rankB;
                        return a.trackName.localeCompare(b.trackName);
                    }).forEach(tGroup => {
                        let trackColCount = tGroup.venues.length;
                        dateColCount += trackColCount;
                        trackGroups.push({
                            trackName: tGroup.trackName,
                            eventUrl: tGroup.eventUrl,
                            span: trackColCount
                        });

                        const venueOrderingRank = {
                            'Esplanade Tranquille': 1,
                            'Studio-Théâtre des Grands Ballets': 2,
                            'Maison symphonique': 3,
                            'Espace SAT': 4,
                            'Satosphère': 5,
                            'MTELUS': 6
                        };

                        tGroup.venues.sort((a, b) => {
                            const rA = venueOrderingRank[a.venue] ?? 99;
                            const rB = venueOrderingRank[b.venue] ?? 99;
                            if (rA !== rB) return rA - rB;
                            return a.venue.localeCompare(b.venue);
                        }).forEach(v => {
                            columns.push({
                                date,
                                dayName: dayNames[date] || '',
                                venue: v.venue,
                                trackName: v.trackName,
                                eventUrl: v.eventUrl,
                                performances: v.performances,
                                isLastInDate: false
                            });
                        });
                    });

                    if (columns.length > 0) {
                        columns[columns.length - 1].isLastInDate = true;
                    }

                    dateGroups.push({
                        date,
                        dayName: dayNames[date],
                        span: dateColCount,
                        tracks: trackGroups
                    });
                }
            });

            // Map alternating color styles strictly across visible days from left to right
            const dateThemesMap = {};
            dateGroups.forEach((dg, idx) => {
                dateThemesMap[dg.date] = dateColorThemes[idx % dateColorThemes.length];
            });

            let html = ``;

            if (columns.length === 0) {
                const emptyMessage = showFavoritesOnly 
                    ? `<p class="text-sm font-semibold">No favorites saved yet.</p><p class="text-xs text-gray-500 mt-1">Star performances across the festival grid to see your personalized view here.</p>`
                    : `<p class="text-sm font-semibold">No tracks selected.</p><p class="text-xs text-gray-500 mt-1">Toggle track buttons above to display festival programs.</p>`;

                gridContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-12 text-center text-gray-400">
                        <i data-lucide="${showFavoritesOnly ? 'star-off' : 'eye-off'}" class="w-8 h-8 mb-2 opacity-50"></i>
                        ${emptyMessage}
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const columnWidth = 110;
            const timeAxisWidth = 44;
            const totalWidth = timeAxisWidth + (columns.length * columnWidth);

            html += `<div style="width: ${Math.max(totalWidth, 100)}px;" class="flex flex-col">`;

            // === 1. TOP 2D STICKY HEADERS ===
            
            // Layer 1: Date Bar
            html += `<div class="sticky-header-row flex border-b border-gray-800/60" style="top: 0px;">`;
            html += `<div style="width: ${timeAxisWidth}px; min-width: ${timeAxisWidth}px; height: 36px;" class="sticky-corner-cell bg-[#1A1A24] border-r border-gray-800 flex items-center justify-center text-[10px] font-bold text-gray-400 uppercase tracking-wider shrink-0 shadow-md">Time</div>`;
            
            dateGroups.forEach(dg => {
                const w = dg.span * columnWidth;
                const theme = dateThemesMap[dg.date];
                html += `
                    <div style="width: ${w}px; height: 36px;" class="border-r border-gray-800 px-2 text-center flex flex-col justify-center items-center ${theme.dateBar}">
                        <span class="text-xs sm:text-sm font-bold ${theme.dateText} tracking-wide truncate">${dg.dayName}, ${dg.date}</span>
                    </div>
                `;
            });
            html += `</div>`;

            // Layer 2: Track Bar
            html += `<div class="sticky-header-row flex border-b border-gray-800/60" style="top: 36px;">`;
            html += `<div style="width: ${timeAxisWidth}px; min-width: ${timeAxisWidth}px; height: 28px;" class="sticky-corner-cell bg-[#17171F] border-r border-gray-800 shrink-0 shadow-md"></div>`;
            
            dateGroups.forEach(dg => {
                const theme = dateThemesMap[dg.date];
                dg.tracks.forEach(tg => {
                    const w = tg.span * columnWidth;
                    const catKey = getTrackCategory(tg.trackName);
                    const style = trackColors[catKey] || trackColors.DEFAULT;
                    
                    html += `
                        <div style="width: ${w}px; height: 28px;" class="border-r border-gray-800/80 px-1.5 text-center text-[10px] sm:text-xs font-semibold uppercase tracking-wider flex items-center justify-center ${theme.trackBar}">
                            <a href="${tg.eventUrl}" target="_blank" rel="noopener noreferrer" class="hover:underline flex items-center gap-1 leading-tight ${style.text} hover:text-white transition-colors truncate">
                                <span class="truncate">${tg.trackName}</span>
                                <i data-lucide="external-link" class="w-2.5 h-2.5 opacity-70 shrink-0"></i>
                            </a>
                        </div>
                    `;
                });
            });
            html += `</div>`;

            // Layer 3: Venue Bar
            html += `<div class="sticky-header-row flex border-b border-gray-800 shadow-lg" style="top: 64px;">`;
            html += `<div style="width: ${timeAxisWidth}px; min-width: ${timeAxisWidth}px; height: 32px;" class="sticky-corner-cell bg-[#14141A] border-r border-gray-800 shrink-0 shadow-md"></div>`;
            
            columns.forEach(col => {
                const theme = dateThemesMap[col.date];
                const borderClass = col.isLastInDate ? theme.borderRight : 'border-r border-gray-800/80';
                html += `
                    <div style="width: ${columnWidth}px; height: 32px;" class="${borderClass} ${theme.venueBar} px-1.5 text-center text-[11px] font-medium text-gray-300 flex items-center justify-center gap-1">
                        <i data-lucide="map-pin" class="w-2.5 h-2.5 text-purple-400 shrink-0"></i>
                        <span class="break-words leading-tight" title="${col.venue}">${col.venue}</span>
                    </div>
                `;
            });
            html += `</div>`;

            // === 2. GRID BODY ===
            const gridHeight = totalHours * hourScaleHeight;
            html += `<div class="flex relative time-grid-bg" style="height: ${gridHeight}px;">`;

            // Y-Axis Time Scale Column
            html += `<div style="width: ${timeAxisWidth}px; min-width: ${timeAxisWidth}px;" class="sticky-time-col bg-[#0D0D11] border-r border-gray-700/80 flex flex-col select-none shrink-0 shadow-2xl">`;
            for (let hour = minHour; hour < maxHour; hour++) {
                const topPos = (hour - minHour) * hourScaleHeight;
                const displayHour = hour >= 24 ? hour - 24 : hour;
                const formattedHour = `${String(displayHour).padStart(2, '0')}:00`;
                html += `
                    <div style="top: ${topPos}px; height: ${hourScaleHeight}px;" class="absolute w-full border-t border-gray-800/60 pt-1 text-[10px] font-mono text-gray-300 flex items-start justify-center">
                        ${formattedHour}
                    </div>
                `;
            }
            html += `</div>`;

            // Venue Columns & Event Boxes
            columns.forEach(col => {
                const theme = dateThemesMap[col.date];
                const borderClass = col.isLastInDate ? theme.borderRight : 'border-r border-gray-800/40';
                
                html += `<div style="width: ${columnWidth}px;" class="relative ${borderClass} h-full ${theme.columnBody}">`;

                for (let hour = minHour; hour < maxHour; hour++) {
                    const topPos = (hour - minHour) * hourScaleHeight;
                    html += `<div style="top: ${topPos}px;" class="absolute w-full border-t border-gray-800/20"></div>`;
                }

                let unknownTimeOffset = 10;
                col.performances.forEach(perf => {
                    const startVal = parseTimeToHours(perf.start_time, perf.date);
                    const endVal = parseTimeToHours(perf.end_time, perf.date);
                    const isFav = favoritesSet.has(perf.id);
                    const catKey = getTrackCategory(perf.track);

                    const isSearchMatched = currentSearch.trim() === '' || 
                        perf.artist.toLowerCase().includes(currentSearch.toLowerCase()) || 
                        perf.track.toLowerCase().includes(currentSearch.toLowerCase());

                    if (showFavoritesOnly && !isFav) {
                        return;
                    }

                    const isDimmed = !isSearchMatched;
                    const style = trackColors[catKey] || trackColors.DEFAULT;
                    const favoriteClass = isFav ? 'is-favorite' : '';
                    const starIconClass = isFav ? 'fill-amber-400 text-amber-400' : 'text-gray-400 hover:text-amber-300';

                    if (startVal !== null && endVal !== null) {
                        let durationHours = endVal - startVal;
                        if (durationHours <= 0) durationHours = 0.5;

                        const topPixels = (startVal - minHour) * hourScaleHeight;
                        const heightPixels = Math.max(durationHours * hourScaleHeight, 36);

                        html += `
                            <div style="top: ${topPixels}px; height: ${heightPixels}px; left: 3px; right: 3px;" 
                                 onclick='openModal(${JSON.stringify(perf).replace(/'/g, "&apos;")})'
                                 class="absolute performance-card rounded-lg p-1.5 border ${style.bg} ${style.border} ${favoriteClass} cursor-pointer flex flex-col justify-between overflow-hidden group shadow-md transition-all ${!isDimmed ? 'opacity-100 ring-1 ring-white/10' : 'opacity-20 grayscale'}">
                                <div>
                                    <div class="flex items-start justify-between gap-0.5">
                                        <h4 class="font-bold text-[11px] text-white leading-tight break-words whitespace-normal group-hover:text-blue-200" title="${perf.artist}">
                                            ${perf.artist}
                                        </h4>
                                        <button onclick="toggleFavorite('${perf.id}', event)" class="p-0.5 -mt-0.5 -mr-0.5 rounded hover:bg-white/10 transition-colors shrink-0" title="Toggle Favorite">
                                            <i data-lucide="star" class="w-3 h-3 ${starIconClass}"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between text-[9px] text-gray-300 font-mono mt-0.5 pt-0.5 border-t border-white/10">
                                    ${perf.is_tbd ? `
                                        <span class="flex items-center gap-0.5 font-semibold text-amber-400">
                                            <i data-lucide="clock" class="w-2 h-2 text-amber-400"></i>
                                            TBD
                                        </span>
                                        <span class="text-[8px] text-gray-400">(TBD)</span>
                                    ` : `
                                        <span class="flex items-center gap-0.5 font-semibold">
                                            <i data-lucide="clock" class="w-2 h-2 text-gray-400"></i>
                                            ${perf.start_time}
                                        </span>
                                        <span class="text-[8px] text-gray-400">${perf.end_time}</span>
                                    `}
                                </div>
                            </div>
                        `;
                    } else {
                        const topPixels = unknownTimeOffset;
                        unknownTimeOffset += 56;

                        html += `
                            <div style="top: ${topPixels}px; height: 50px; left: 3px; right: 3px;" 
                                 onclick='openModal(${JSON.stringify(perf).replace(/'/g, "&apos;")})'
                                 class="absolute performance-card rounded-lg p-1.5 border bg-gray-900/90 border-dashed border-gray-600 ${favoriteClass} cursor-pointer flex flex-col justify-between overflow-hidden shadow-md ${!isDimmed ? 'opacity-100' : 'opacity-20'}">
                                <div class="flex items-start justify-between gap-0.5">
                                    <h4 class="font-semibold text-[10px] text-gray-200 break-words whitespace-normal leading-tight" title="${perf.artist}">${perf.artist}</h4>
                                    <button onclick="toggleFavorite('${perf.id}', event)" class="p-0.5 -mt-0.5 -mr-0.5 rounded hover:bg-white/10 transition-colors shrink-0" title="Toggle Favorite">
                                        <i data-lucide="star" class="w-3 h-3 ${starIconClass}"></i>
                                    </button>
                                </div>
                                <div class="text-[9px] text-gray-400 font-mono">Time: TBD</div>
                            </div>
                        `;
                    }
                });

                html += `</div>`;
            });

            html += `</div>`;
            html += `</div>`;

            gridContainer.innerHTML = html;
            lucide.createIcons();
        }

        function renderDateFilters() {
            const dateContainer = document.getElementById('dateFilters');
            const dates = ["ALL", "25 Aug", "26 Aug", "27 Aug", "28 Aug", "29 Aug", "30 Aug"];

            dateContainer.innerHTML = dates.map(d => {
                const isActive = activeDateFilter === d;
                const label = d === 'ALL' ? 'All Days' : d;
                return `
                    <button onclick="setDateFilter('${d}')" 
                        class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all ${
                            isActive 
                            ? 'bg-blue-600 text-white shadow-sm' 
                            : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800'
                        }">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        function setDateFilter(dateStr) {
            activeDateFilter = dateStr;
            renderDateFilters();
            renderSchedule();
        }

        function toggleAllTracks() {
            if (activeTracksSet.size === allTrackKeys.length) {
                activeTracksSet.clear();
            } else {
                activeTracksSet = new Set(allTrackKeys);
            }
            renderTrackLegend();
            renderSchedule();
        }

        function toggleTrackFilter(trackKey) {
            if (activeTracksSet.has(trackKey)) {
                activeTracksSet.delete(trackKey);
            } else {
                activeTracksSet.add(trackKey);
            }
            renderTrackLegend();
            renderSchedule();
        }

        function renderTrackLegend() {
            const legendContainer = document.getElementById('trackLegend');
            const tracks = [
                { name: 'PLAY', key: 'PLAY' },
                { name: 'EXPÉRIENCE', key: 'EXPÉRIENCE' },
                { name: 'X/VISIONS', key: 'X/VISIONS' },
                { name: 'NOCTURNE', key: 'NOCTURNE' },
                { name: 'MÉTROPOLIS', key: 'MÉTROPOLIS' }
            ];

            const allActive = activeTracksSet.size === allTrackKeys.length;

            let html = `
                <button onclick="toggleAllTracks()" 
                    class="px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all flex items-center gap-1.5 ${
                        allActive
                        ? 'bg-blue-600 text-white shadow-sm ring-1 ring-blue-400/40'
                        : 'bg-[#1A1A24] text-gray-400 hover:text-gray-200 hover:bg-gray-800 border border-gray-800/80'
                    }">
                    <span>${allActive ? 'Hide All' : 'Show All'}</span>
                </button>
            `;

            html += tracks.map(t => {
                const conf = trackColors[t.key];
                const isEnabled = activeTracksSet.has(t.key);
                return `
                    <button onclick="toggleTrackFilter('${t.key}')" 
                        class="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium whitespace-nowrap transition-all border ${
                            isEnabled
                            ? 'bg-white/15 text-white border-white/40 ring-1 ring-white/30 shadow-md'
                            : 'bg-[#14141A] text-gray-500 opacity-50 hover:opacity-80 border-gray-800'
                        }">
                        <span class="w-2 h-2 rounded-full shrink-0 ${isEnabled ? '' : 'grayscale'}" style="background-color: ${conf.accent};"></span>
                        <span class="${isEnabled ? '' : 'line-through'}">${t.name}</span>
                    </button>
                `;
            }).join('');

            legendContainer.innerHTML = html;
        }

        function updateModalFavBtn(isFav) {
            const btn = document.getElementById('modalFavBtn');
            if (isFav) {
                btn.innerHTML = `<i data-lucide="star" class="w-5 h-5 fill-amber-400 text-amber-400"></i>`;
            } else {
                btn.innerHTML = `<i data-lucide="star" class="w-5 h-5 text-gray-400"></i>`;
            }
            lucide.createIcons();
        }

        function openModal(perf) {
            currentModalPerf = perf;
            const modal = document.getElementById('artistModal');
            const content = document.getElementById('artistModalContent');
            
            document.getElementById('modalArtistName').textContent = perf.artist;
            document.getElementById('modalTrackBadge').textContent = perf.track;
            document.getElementById('modalDate').textContent = `${perf.date} 2026 (${dayNames[perf.date] || ''})`;
            document.getElementById('modalTime').textContent = perf.is_tbd ? 'TBD (Times TBA)' : `${perf.start_time} - ${perf.end_time}`;
            document.getElementById('modalVenue').textContent = perf.venue;
            
            updateModalFavBtn(favoritesSet.has(perf.id));

            const favBtn = document.getElementById('modalFavBtn');
            favBtn.onclick = () => {
                toggleFavorite(perf.id);
            };

            const linkBtn = document.getElementById('modalEventLink');
            
            if (perf.profile_url) {
                linkBtn.href = perf.profile_url;
                linkBtn.classList.remove('hidden');
                linkBtn.querySelector('span').textContent = 'View Artist Profile';
            } else if (perf.event_url) {
                linkBtn.href = perf.event_url;
                linkBtn.classList.remove('hidden');
                linkBtn.querySelector('span').textContent = 'View Event Page';
            } else {
                linkBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            currentModalPerf = null;
            const modal = document.getElementById('artistModal');
            const content = document.getElementById('artistModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        window.onload = function() {
            updateFavoritesCountBadge();
            renderDateFilters();
            renderTrackLegend();
            renderSchedule();

            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');

            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                if (currentSearch) {
                    clearSearch.classList.remove('hidden');
                } else {
                    clearSearch.classList.add('hidden');
                }
                renderSchedule();
            });

            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                currentSearch = '';
                clearSearch.classList.add('hidden');
                renderSchedule();
            });

            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('artistModal').addEventListener('click', (e) => {
                if (e.target.id === 'artistModal') closeModal();
            });

            document.getElementById('zoomInBtn').addEventListener('click', () => {
                if (hourScaleHeight < 140) {
                    hourScaleHeight += 15;
                    document.getElementById('zoomLevelText').textContent = `${Math.round((hourScaleHeight/70)*100)}%`;
                    renderSchedule();
                }
            });

            document.getElementById('zoomOutBtn').addEventListener('click', () => {
                if (hourScaleHeight > 45) {
                    hourScaleHeight -= 15;
                    document.getElementById('zoomLevelText').textContent = `${Math.round((hourScaleHeight/70)*100)}%`;
                    renderSchedule();
                }
            });
        };
    </script>
</body>
</html>
